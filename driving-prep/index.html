<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Driving Test Prep</title>
  <script>
    // set theme before paint to avoid a flash
    try {
      var t = localStorage.getItem("driving-prep-theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-in">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M3 12h7M14 12h7M12 14v7"/></svg>
        </span>
        <span class="brand-name" data-i18n="title">Driving Test Prep</span>
      </div>
      <div class="actions">
        <button id="lang" class="icon-btn text" data-i18n="langBtn">اردو</button>
        <button id="theme" class="icon-btn" aria-label="Switch theme">
          <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow" data-i18n="sub">Computer test + Practical test</p>
        <h1 data-i18n="title">Driving Test Prep</h1>
        <p class="hero-date" data-i18n="date">17 November 2026</p>
      </div>
      <div class="count">
        <b id="cd-num">--</b>
        <span id="cd-label"></span>
      </div>
    </section>

    <nav class="tabs" aria-label="Sections">
      <button data-tab="quiz">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
        <span data-i18n="tabQuiz">Quiz</span>
      </button>
      <button data-tab="practical">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
        <span data-i18n="tabPractical">Practical</span>
      </button>
      <button data-tab="plan">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span data-i18n="tabPlan">Plan</span>
      </button>
      <button data-tab="progress">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span data-i18n="tabProgress">Progress</span>
      </button>
    </nav>

    <section id="tab-quiz" class="panel">
      <div class="controls card">
        <label><span data-i18n="topic">Topic</span>
          <select id="cat">
            <option value="All" data-i18n="All">All topics</option>
            <option value="Signs" data-i18n="Signs">Road signs</option>
            <option value="Rules" data-i18n="Rules">Rules</option>
            <option value="Safety" data-i18n="Safety">Safety</option>
            <option value="Situations" data-i18n="Situations">Situations</option>
            <option value="Weak" data-i18n="Weak">Weak questions</option>
          </select>
        </label>
        <label><span data-i18n="count">Questions</span>
          <select id="count">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="40">40</option>
          </select>
        </label>
        <button id="start" class="primary" data-i18n="start">Start</button>
      </div>
      <div id="quiz-area" class="card"></div>
    </section>

    <section id="tab-practical" class="panel" hidden>
      <p class="note" data-i18n="practicalNote"></p>
      <div id="practical-area"></div>
    </section>

    <section id="tab-plan" class="panel" hidden>
      <p class="note" data-i18n="planNote"></p>
      <div id="plan-area" class="card"></div>
    </section>

    <section id="tab-progress" class="panel" hidden>
      <div id="progress-area"></div>
    </section>

    <footer><small data-i18n="footer"></small></footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
